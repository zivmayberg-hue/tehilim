name: Omer evening reminder

on:
  # The Omer evening message (Sefirat HaOmer, March to June). The Vercel trigger (tehilim-trigger) starts this at
  # 13:00 and 13:30 UTC = 17:00 and 17:30 Dubai on Omer evenings; these two GitHub schedules are a backup.
  # notify.js decides whether tonight has a message (none on Shabbat, Yom Tov or the evening before them: those
  # counts go out in the morning message). The first run sends; the others find "YYYY-MM-DD вечер" in notify/sent.log.
  # A run that starts after sunset in Dubai sends to the admin's Telegram only (see notify.js).
  schedule:
    - cron: "13 13 * 3-6 *"
    - cron: "43 13 * 3-6 *"
  workflow_dispatch:
    inputs:
      mode:
        description: "normal / dry-run / test-message"
        required: true
        default: "dry-run"
        type: choice
        options: [normal, dry-run, test-message]

permissions:
  contents: write

# One run at a time, shared with the morning reminder (same group), so sent.log pushes never collide:
# a queued run waits until the previous one has finished, including pushing sent.log.
# (GitHub keeps at most one run waiting; a newer one replaces it, which is fine because one run is enough.)
concurrency:
  group: whatsapp-reminder
  cancel-in-progress: false

jobs:
  evening:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Check out the branch as it is when this run starts, so it sees the log pushed by the previous run
      # (without ref, a run queued earlier would check out the older commit and could send twice).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install the Jewish calendar library (Hebcal)
        run: npm install --no-save --no-package-lock --prefix notify @hebcal/core@5.8.0
      - name: Build and send tonight's Omer message
        env:
          TZ: Asia/Dubai
          SEND_MODE: ${{ vars.SEND_MODE || 'telegram' }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          ADMIN_TG_CHAT_ID: ${{ secrets.ADMIN_TG_CHAT_ID }}
          WA_PROVIDER: ${{ secrets.WA_PROVIDER }}
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_INSTANCE: ${{ secrets.WA_INSTANCE }}
          WA_GROUP_ID: ${{ secrets.WA_GROUP_ID }}
          DRY_RUN: ${{ github.event.inputs.mode == 'dry-run' && '1' || '0' }}
          TEST_MESSAGE: ${{ github.event.inputs.mode == 'test-message' && '1' || '0' }}
        run: node notify/notify.js evening
      - name: Save the sent log (also keeps the schedule active)
        run: |
          if [ -n "$(git status --porcelain notify/sent.log notify/alerts.log)" ]; then
            git config user.name "tehilim-bot"
            git config user.email "tehilim-bot@users.noreply.github.com"
            git add notify/sent.log notify/alerts.log
            git commit -m "Evening reminder sent $(TZ=Asia/Dubai date +%F)"
            for i in 1 2 3; do
              git pull --rebase -q origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
              sleep 10
            done
            echo "Could not save notify/sent.log"; exit 1
          fi
